# Docker Compose principal - MediaHome
# Estrutura modular: cada serviço tem seu próprio arquivo na pasta correspondente
# Antes de usar: copie .env.example para .env e ajuste os valores
# Para iniciar todos: docker compose up -d
# Para iniciar serviço específico: docker compose --env-file .env -f jellyfin/jellyfin.yml up -d

include:
  # Serviços de mídia
  - jellyfin/jellyfin.yml
  - komga/komga.yml
  - navidrome/navidrome.yml
  
  # Serviços de infraestrutura
  - fileserver/samba.yml
  - portainer/portainer.yml
  
  # Downloads (Torrent)
  - qbittorrent/qbittorrent.yml

# Rede compartilhada entre todos os serviços
# (declarada de forma idêntica em cada .yml de serviço para permitir subir
#  cada um isoladamente com "docker compose --env-file .env -f servico/servico.yml up -d")
networks:
  mediahome:
    name: ${DOCKER_NETWORK:-mediahome}
    driver: bridge