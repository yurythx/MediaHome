# Portainer - Interface de gerenciamento Docker
# Para iniciar apenas este serviço: docker compose --env-file .env -f portainer/portainer.yml up -d
# Para usar com compose principal: incluído automaticamente
# Variáveis lidas do .env na raiz do projeto (veja .env.example)
#
# ATENÇÃO: este serviço monta o socket do Docker (equivale a acesso root ao
# host). Não exponha a porta diretamente na internet sem VPN/allowlist de IP
# e uma senha forte.
#
# Sem healthcheck de propósito: a imagem "portainer/base" é minimalista e não
# tem curl/wget/shell confirmados — um healthcheck com comando inexistente
# marcaria o container como "unhealthy" mesmo funcionando normalmente.

services:
  portainer:
    image: portainer/portainer-ce:2.39.4
    container_name: portainer
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      # Configurações no SSD
      - ${CONFIG_PATH:-/mnt/config}/portainer:/data
      # Socket do Docker
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${PORTAINER_PORT:-9020}:9000"
    networks:
      - mediahome

networks:
  mediahome:
    name: ${DOCKER_NETWORK:-mediahome}
    driver: bridge
