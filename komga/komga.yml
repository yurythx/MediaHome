# Komga - Servidor de quadrinhos/mangás
# Para iniciar apenas este serviço: docker compose --env-file .env -f komga/komga.yml up -d
# Para usar com compose principal: incluído automaticamente
# Variáveis lidas do .env na raiz do projeto (veja .env.example)

services:
  komga:
    image: gotson/komga:1.25.0
    container_name: komga
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      # Configurações no SSD
      - ${CONFIG_PATH:-/mnt/config}/komga:/config
      # Quadrinhos nos HDs (somente leitura)
      - ${MEDIA_PATH_1:-/mnt/dados}:/data:ro
      # Segundo disco (dados2)
      - ${MEDIA_PATH_2:-/mnt/dados2}:/data2:ro
      # Disco externo
      - ${MEDIA_PATH_EXT:-/mnt/externo}:/data3:ro
    ports:
      - "${KOMGA_PORT:-8082}:25600"
    healthcheck:
      # curl está presente na imagem (instalado via apt no Dockerfile oficial)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:25600/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mediahome

networks:
  mediahome:
    name: ${DOCKER_NETWORK:-mediahome}
    driver: bridge
