# Navidrome - Servidor de música
# Para iniciar apenas este serviço: docker compose -f navidrome/navidrome.yml up -d
# Para usar com compose principal: incluído automaticamente
# Variáveis lidas do .env na raiz do projeto (veja .env.example)

services:
  navidrome:
    image: deluan/navidrome:0.63.2
    container_name: navidrome
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Sao_Paulo}
      # Escanear múltiplas pastas de música
      - ND_MUSICFOLDERS=/music,/music2
    volumes:
      # Configurações no SSD
      - ${CONFIG_PATH:-/mnt/config}/navidrome:/data
      # Música nos HDs (somente leitura)
      - ${MEDIA_PATH_1:-/mnt/dados}:/music:ro
      # Segundo disco (dados2)
      - ${MEDIA_PATH_2:-/mnt/dados2}:/music2:ro
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    healthcheck:
      # a imagem é Alpine e não tem curl; usa o wget do busybox
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4533/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mediahome

networks:
  mediahome:
    name: ${DOCKER_NETWORK:-mediahome}
    driver: bridge
